# Production-style stack. Unlike docker-compose.yml (dev), the source tree is NOT
# bind-mounted — the app image is self-contained (code + vendor + built assets from
# the multi-stage Dockerfile). Bring up with:
#
#   cp .env.production.example .env   # then fill every CHANGEME
#   docker compose -f docker-compose.prod.yml up -d --build
#
# In a real deployment MySQL/Redis/object storage are usually MANAGED services, not
# containers — point the env at them and drop those services here. See docs/DEPLOY.md.
services:
  # PHP-FPM app container. Its entrypoint runs the release steps (migrate --force,
  # permissions:sync, config/route/view cache) then serves — see docker/php/entrypoint.sh.
  app:
    build:
      context: .
      target: app
    entrypoint: ["sh", "/var/www/html/docker/php/entrypoint.sh"]
    command: ["php-fpm"]
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    # `app-code` is populated from the image's /var/www/html on first creation and
    # shared read-only with nginx, so both see identical files at the same path
    # (nginx sends SCRIPT_FILENAME as that path to php-fpm). NOTE: a named volume is
    # only seeded from the image while empty — after building a new image, recreate
    # it (`docker compose -f docker-compose.prod.yml down -v` or prune the volume)
    # so the new code lands. See docs/DEPLOY.md.
    volumes:
      - app-code:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "80:8000"
    volumes:
      - app-code:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # Runs Laravel's scheduler (schedule:work ticks every minute and dispatches the
  # due commands — outbox:work, hris:sync-employees, audit:verify, notifications:overdue).
  scheduler:
    build:
      context: .
      target: app
    entrypoint: ["sh", "/var/www/html/docker/php/worker-entrypoint.sh"]
    command: ["php", "artisan", "schedule:work"]
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - app-code:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Processes the queue (notifications are queued on Redis). Scale with --scale queue=N.
  queue:
    build:
      context: .
      target: app
    entrypoint: ["sh", "/var/www/html/docker/php/worker-entrypoint.sh"]
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--max-time=3600"]
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - app-code:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cipherlearn}
      MYSQL_USER: ${DB_USERNAME:-cipherlearn}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-cipherlearn}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-miniosecret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-cipherlearn} ${AWS_SECRET_ACCESS_KEY:-miniosecret} &&
      mc mb --ignore-existing local/${AWS_BUCKET:-cipherlearn} &&
      mc anonymous set download local/${AWS_BUCKET:-cipherlearn};
      "
    restart: "no"

volumes:
  app-code:
  mysql-data:
  redis-data:
  minio-data:
