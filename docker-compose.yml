# Local development stack. Brings up the app, MySQL 8, Redis and MinIO together.
# The source tree is bind-mounted for live editing; the app image supplies PHP
# 8.3 and the required extensions. For a production build see the multi-stage
# Dockerfile (the `app` stage is what runs in the cloud — no bind mount there).
services:
  app:
    build:
      context: .
      target: app
    # The image entrypoint drops privileges to www-data; here we override the
    # command to wait-for-db + migrate + serve via the dev entrypoint.
    entrypoint: ["sh", "/var/www/html/docker/php/entrypoint.sh"]
    command: ["php-fpm"]
    # Laravel reads the bind-mounted .env file directly. We deliberately do NOT
    # use `env_file: .env` — that snapshots an empty APP_KEY as a real container
    # env var at launch, which then shadows the key the entrypoint generates into
    # the .env file (real env vars win over the file in Laravel). Only the two
    # vars the entrypoint's shell needs for its wait-for-db loop are set here.
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    volumes:
      - ./:/var/www/html
      # Dev OPcache override so bind-mounted code changes are picked up without
      # a container restart (production keeps validate_timestamps=0).
      - ./docker/php/php.dev.ini:/usr/local/etc/php/conf.d/zzz-dev.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: cipherlearn
      MYSQL_USER: cipherlearn
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: cipherlearn
      MINIO_ROOT_PASSWORD: miniosecret
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Catches every email the app sends in dev/demo (SMTP on 1025) and shows it in a
  # web inbox at http://localhost:8025 — so queued notifications are visible without
  # a real mail provider. Point MAIL at it: MAIL_MAILER=smtp, MAIL_HOST=mailpit.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # web inbox
    restart: unless-stopped

  # One-shot: create the bucket the app expects and make objects readable so
  # signed-URL-free public assets work in local dev.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 cipherlearn miniosecret &&
      mc mb --ignore-existing local/cipherlearn &&
      mc anonymous set download local/cipherlearn;
      "
    restart: "no"

volumes:
  mysql-data:
  redis-data:
  minio-data:
