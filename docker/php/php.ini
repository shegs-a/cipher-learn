; Production-leaning PHP settings for the app container. Values that vary by
; environment stay in env vars; this file only holds engine tuning.
memory_limit = 256M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 60
expose_php = Off

; OPcache — safe defaults for a container image where code is immutable.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
